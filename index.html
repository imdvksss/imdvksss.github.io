<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Соняша 💖</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #ffe3ec 0%, #ffd0e0 50%, #ffc2d9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #7a1f45;
  }

  .card {
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .cat {
    width: 160px;
    max-width: 55%;
    margin: 0 auto 8px;
    display: block;
    animation: bob 2.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  h1 {
    font-size: 28px;
    margin: 12px 0 6px;
    color: #d6336c;
    line-height: 1.3;
  }
  .sub { font-size: 16px; margin: 0 0 24px; opacity: 0.85; }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-items: center;
    min-height: 70px;
  }
  button {
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    padding: 16px 34px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease;
    box-shadow: 0 6px 16px rgba(214, 51, 108, 0.25);
  }
  button:active { transform: scale(0.96); }
  #yes {
    background: linear-gradient(135deg, #ff5f8f, #d6336c);
    color: #fff;
  }
  #no {
    background: #cfd4da;
    color: #6b7480;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  /* Календарь */
  .calendar {
    display: none;
    margin-top: 20px;
    background: #fff;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(214, 51, 108, 0.2);
    text-align: left;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cal-header button {
    font-size: 18px;
    padding: 6px 14px;
    border-radius: 10px;
    background: #ffe3ec;
    color: #d6336c;
    box-shadow: none;
  }
  .cal-title { font-weight: 700; font-size: 17px; color: #d6336c; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .dow {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #b0879a;
    padding: 4px 0;
  }
  .day {
    text-align: center;
    padding: 9px 0;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease;
    user-select: none;
  }
  .day:hover { background: #ffe3ec; }
  .day.empty { cursor: default; }
  .day.past { color: #ccc; cursor: default; }
  .day.past:hover { background: none; }
  .day.selected {
    background: linear-gradient(135deg, #ff5f8f, #d6336c);
    color: #fff;
    font-weight: 700;
  }
  .confirm {
    display: none;
    margin-top: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #d6336c;
  }
  .confirm .sub2 { font-weight: 400; font-size: 15px; margin-top: 6px; color: #7a1f45; }

  /* Полноэкранный финал с фото */
  .final {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000 center / cover no-repeat;
    /* ЗАМЕНИ ссылку ниже на своё фото (или положи файл рядом: url('foto.jpg')) */
    background-image: url('foto.HEIC');
    animation: fadeIn 0.8s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .final::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(122,31,69,0.75) 0%, rgba(0,0,0,0) 55%);
  }
  .final-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 24px calc(34px + env(safe-area-inset-bottom));
    text-align: center;
    color: #fff;
    z-index: 2;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .final-caption h2 { font-size: 30px; margin: 0 0 8px; }
  .final-caption p { font-size: 18px; margin: 0; opacity: 0.95; }

  /* Падающие сердечки */
  .heart {
    position: fixed;
    top: -40px;
    font-size: 22px;
    pointer-events: none;
    z-index: 1;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>

    heartRain();
    buildCalendar();
  });

  // ── Календарь ──
  const months = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                  'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let view = new Date();
  view.setDate(1);
  const today = new Date();
  today.setHours(0,0,0,0);

  // шапка дней недели
  const dowRow = document.getElementById('dowRow');
  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    dowRow.appendChild(el);
  });

  function buildCalendar() {
    const grid = document.getElementById('calDays');
    grid.innerHTML = '';
    const y = view.getFullYear();
    const m = view.getMonth();
    document.getElementById('calTitle').textContent = months[m] + ' ' + y;

    // сдвиг: getDay() 0=вс -> хотим пн первым
    let firstDow = new Date(y, m, 1).getDay();
    firstDow = (firstDow === 0) ? 6 : firstDow - 1;
    const daysInMonth = new Date(y, m + 1, 0).getDate();

    for (let i = 0; i < firstDow; i++) {
      const e = document.createElement('div');
      e.className = 'day empty';
      grid.appendChild(e);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'day';
      cell.textContent = d;
      const cellDate = new Date(y, m, d);
      if (cellDate < today) {
        cell.classList.add('past');
      } else {
        cell.addEventListener('click', () => selectDay(cell, cellDate));
      }
      grid.appendChild(cell);
    }
  }

  let chosenLabel = '';
  function selectDay(cell, date) {
    document.querySelectorAll('.day.selected')
      .forEach(el => el.classList.remove('selected'));
    cell.classList.add('selected');
    const dd = String(date.getDate()).padStart(2, '0');
    chosenLabel = dd + ' ' + months[date.getMonth()].toLowerCase();
    document.getElementById('confirmText').innerText =
      'Отлично, ' + chosenLabel + '! 💖';
    const confirm = document.getElementById('confirm');
    confirm.style.display = 'block';
    confirm.style.cursor = 'pointer';
    document.getElementById('confirm').querySelector('.sub2').innerText =
      'жду не дождусь 🎀 (нажми ✨)';
  }

  // Тап по подтверждению — открыть полноэкранный финал
  document.getElementById('confirm').addEventListener('click', () => {
    if (!chosenLabel) return;
    document.getElementById('finalDate').innerText = chosenLabel;
    document.getElementById('final').style.display = 'block';
  });

  document.getElementById('prev').addEventListener('click', () => {
    view.setMonth(view.getMonth() - 1);
    buildCalendar();
  });
  document.getElementById('next').addEventListener('click', () => {
    view.setMonth(view.getMonth() + 1);
    buildCalendar();
  });

  // ── Дождь из сердечек ──
  function heartRain() {
    const emojis = ['💖','💕','🎀','💗','🐱','✨'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.animationDuration = (2 + Math.random() * 3) + 's';
        h.style.fontSize = (16 + Math.random() * 20) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 5000);
      }, i * 80);
    }
  }
</script>
